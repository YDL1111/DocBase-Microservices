# 注意：本配置仅监听 HTTP 80，用于本地开发（Compose 映射 3000:80）。
# 生产部署前必须在外部反向代理 / 负载均衡器终止 TLS：
#   - 强制 HTTP 跳转 HTTPS
#   - 配置 HSTS
#   - 密码明文（login 接口）仅在 HTTPS 下安全
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：所有未命中静态资源的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # AI / SSE 长连接：关闭缓冲、延长超时（为后续 Chat 阶段预留）
    location /api/ai/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # 通用 API：统一转发到 Gateway（不剥离 /api 前缀）
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
