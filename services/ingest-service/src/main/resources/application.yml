server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: ingest-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import:
      - optional:nacos:common.yaml?group=DOCBASE_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DOCBASE_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:change-me-nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
        ip-type: IPv4
      config:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
    openfeign:
        client:
          config:
            default:
              connect-timeout: 3000
              read-timeout: 10000
              logger-level: basic
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${INGEST_DB_NAME:docbase_ingest}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${INGEST_DB_USER:docbase_ingest}
    password: ${INGEST_DB_PASSWORD:change-me-ingest-db}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${INGEST_REDIS_USER:ingest}
      password: ${INGEST_REDIS_PASSWORD:change-me-ingest-redis}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:docbase}
    password: ${RABBITMQ_PASSWORD:change-me-rabbitmq}
    virtual-host: ${RABBITMQ_VHOST:/docbase}
    # Enable publisher confirms and returns for reliable message delivery
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 2

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/docbase-iam-public.pem}
  issuer: ${IAM_JWT_ISSUER:docbase-iam}
  fail-closed: ${JWT_FAIL_CLOSED:false}

docbase:
  rag:
    base-url: ${RAG_BASE_URL:http://rag-service:8090}
  ingest:
    poll-interval-ms: ${INGEST_POLL_INTERVAL_MS:5000}
    retry-poll-interval-ms: ${INGEST_RETRY_POLL_INTERVAL_MS:30000}
    batch-size: ${INGEST_BATCH_SIZE:10}
    max-retries: ${INGEST_MAX_RETRIES:3}
    retry-delays: ${INGEST_RETRY_DELAYS:PT30S,PT5M,PT30M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name},traceId=%X{traceId:-},eventId=%X{eventId:-}] %logger{36} - %msg%n"
