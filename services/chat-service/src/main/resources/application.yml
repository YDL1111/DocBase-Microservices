server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: chat-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  main:
    web-application-type: servlet
  config:
    import:
      - optional:nacos:common.yaml?group=DOCBASE_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DOCBASE_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:change-me-nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
        ip-type: IPv4
      config:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${CHAT_DB_NAME:docbase_chat}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${CHAT_DB_USER:docbase_chat}
    password: ${CHAT_DB_PASSWORD:change-me-chat-db}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${CHAT_REDIS_USER:chat}
      password: ${CHAT_REDIS_PASSWORD:change-me-chat-redis}
      timeout: 3s

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/docbase-iam-public.pem}
  issuer: ${IAM_JWT_ISSUER:docbase-iam}
  fail-closed: ${JWT_FAIL_CLOSED:false}

docbase:
  rag:
    base-url: ${RAG_BASE_URL:http://rag-service:8090}
    model: ${DEEPSEEK_MODEL:keep-existing-deepseek-model}
    embedding-model: BAAI/bge-m3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name},traceId=%X{traceId:-}] %logger{36} - %msg%n"
