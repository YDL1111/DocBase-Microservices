server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:change-me-nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
        ip-type: IPv4
      config:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          routes:
            - id: iam-service
              uri: lb://iam-service
              predicates:
                - Path=/api/auth/**,/api/system/**
            - id: knowledge-service
              uri: lb://knowledge-service
              predicates:
                - Path=/api/knowledge/**
              metadata:
                response-timeout: 120000
            - id: ingest-service
              uri: lb://ingest-service
              predicates:
                - Path=/api/ingest/**
            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: -1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:http://localhost:*}"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
  config:
    import:
      - optional:nacos:common.yaml?group=DOCBASE_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DOCBASE_GROUP&refreshEnabled=true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${GATEWAY_REDIS_USER:gateway}
      password: ${GATEWAY_REDIS_PASSWORD:change-me-gateway-redis}
      timeout: 3s

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/docbase-iam-public.pem}
  issuer: ${IAM_JWT_ISSUER:docbase-iam}

gateway:
  security:
    anonymous-paths:
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /api/auth/ping
      - /api/auth/login
      - /api/auth/refresh

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name},traceId=%X{traceId:-}] %logger{36} - %msg%n"
