spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryClientAutoConfiguration
      - com.alibaba.cloud.nacos.config.NacosConfigBootstrapConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosAutoServiceRegistration

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/docbase-iam-public.pem}
  issuer: ${IAM_JWT_ISSUER:docbase-iam}
  fail-closed: ${JWT_FAIL_CLOSED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

docbase:
  minio:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: test-documents
  document-upload:
    max-file-size: 100MB
    allowed-content-types:
      pdf: application/pdf
      docx: application/vnd.openxmlformats-officedocument.wordprocessingml.document
      xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      pptx: application/vnd.openxmlformats-officedocument.presentationml.presentation
      txt: text/plain
