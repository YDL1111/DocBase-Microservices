server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: knowledge-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import:
      - optional:nacos:common.yaml?group=DOCBASE_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DOCBASE_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:change-me-nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
        ip-type: IPv4
      config:
        namespace: ${NACOS_NAMESPACE:docbase-dev}
        group: ${NACOS_GROUP:DOCBASE_GROUP}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${KNOWLEDGE_DB_NAME:docbase_knowledge}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${KNOWLEDGE_DB_USER:docbase_knowledge}
    password: ${KNOWLEDGE_DB_PASSWORD:change-me-knowledge-db}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${KNOWLEDGE_REDIS_USER:knowledge}
      password: ${KNOWLEDGE_REDIS_PASSWORD:change-me-knowledge-redis}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:docbase}
    password: ${RABBITMQ_PASSWORD:change-me-rabbitmq}
    virtual-host: ${RABBITMQ_VHOST:/docbase}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_DOCUMENT_MAX_FILE_SIZE:100MB}
      max-request-size: ${KNOWLEDGE_DOCUMENT_MAX_REQUEST_SIZE:101MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/docbase-iam-public.pem}
  issuer: ${IAM_JWT_ISSUER:docbase-iam}
  fail-closed: ${JWT_FAIL_CLOSED:false}

docbase:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_APP_USER:docbase-app}
    secret-key: ${MINIO_APP_PASSWORD:change-me-minio-app}
    bucket: ${MINIO_BUCKET:docbase-documents}
  document-upload:
    max-file-size: ${KNOWLEDGE_DOCUMENT_MAX_FILE_SIZE:100MB}
    lease-duration: ${KNOWLEDGE_DOCUMENT_UPLOAD_LEASE_DURATION:PT10M}
    internal-registration-api-key: ${KNOWLEDGE_INTERNAL_REGISTRATION_API_KEY:}
    allowed-content-types:
      pdf: application/pdf
      docx: application/vnd.openxmlformats-officedocument.wordprocessingml.document
      xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      pptx: application/vnd.openxmlformats-officedocument.presentationml.presentation
      txt: text/plain
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    poll-batch-size: ${OUTBOX_POLL_BATCH_SIZE:10}
    max-retries: ${OUTBOX_MAX_RETRIES:3}
    retry-delays: ${OUTBOX_RETRY_DELAYS:PT30S,PT5M,PT30M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name},traceId=%X{traceId:-}] %logger{36} - %msg%n"
